<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Arial, Helvetica, sans-serif">
  <!-- ME-RIISE FOUNDATION — brand lockup recreation (fallback for meriise-logo.png) -->
  <defs>
    <linearGradient id="mlBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3bb4ea"/><stop offset="1" stop-color="#1f9fd8"/>
    </linearGradient>
  </defs>

  <!-- Top row -->
  <g>
    <!-- ME -->
    <text x="18" y="150" font-size="120" font-weight="800" fill="#2aa9e0" letter-spacing="-4">M</text>
    <text x="118" y="150" font-size="120" font-weight="800" fill="#123a5e" letter-spacing="-4">E</text>

    <!-- Monitor with rising chart + green cursor -->
    <g transform="translate(196,66)">
      <rect x="0" y="6" width="118" height="78" rx="8" fill="none" stroke="#123a5e" stroke-width="8"/>
      <polyline points="16,66 44,44 66,54 100,22" fill="none" stroke="#2aa9e0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M92 22 L104 20 L102 34 Z" fill="#5dbb46"/>
      <rect x="46" y="92" width="26" height="10" rx="3" fill="#123a5e"/>
      <rect x="30" y="102" width="58" height="9" rx="4" fill="#123a5e"/>
      <!-- green mouse cursor -->
      <path d="M-6 40 L20 54 L9 57 L14 71 L6 74 L1 60 L-9 66 Z" fill="#5dbb46"/>
    </g>

    <!-- Rocket launching -->
    <g transform="translate(300,20) rotate(45)">
      <path d="M14 0 C30 6 34 26 30 44 L2 44 C-2 26 2 6 14 0 Z" fill="#2aa9e0"/>
      <circle cx="14" cy="20" r="7" fill="#eaf6ff"/>
      <path d="M2 44 L-8 58 L6 52 Z" fill="#123a5e"/>
      <path d="M30 44 L42 56 L28 52 Z" fill="#123a5e"/>
      <path d="M9 46 C11 60 17 60 19 46 C21 56 15 70 14 72 C13 70 7 56 9 46 Z" fill="#f26a21"/>
    </g>

    <!-- RIISE -->
    <text x="330" y="150" font-size="120" font-weight="800" fill="#123a5e" letter-spacing="-4">RIISE</text>

    <!-- Lightbulb -->
    <g transform="translate(560,44)">
      <g stroke="#f9c41b" stroke-width="6" stroke-linecap="round">
        <line x1="30" y1="-4" x2="30" y2="-18"/>
        <line x1="4" y1="8" x2="-6" y2="0"/>
        <line x1="56" y1="8" x2="66" y2="0"/>
      </g>
      <circle cx="30" cy="34" r="26" fill="none" stroke="#24b7e8" stroke-width="7"/>
      <rect x="20" y="60" width="20" height="8" rx="3" fill="#24b7e8"/>
      <rect x="23" y="70" width="14" height="6" rx="3" fill="#24b7e8"/>
    </g>
  </g>

  <!-- FOUNDATION -->
  <text x="320" y="238" text-anchor="middle" font-size="70" font-weight="800" fill="url(#mlBlue)" letter-spacing="2">FOUNDATION</text>
</svg>
