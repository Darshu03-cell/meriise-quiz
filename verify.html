<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ME-RIISE QUIZ — Verify Certificate</title>
  <meta name="theme-color" content="#05070f" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .verify-wrap { max-width:620px; margin-inline:auto; padding: 40px 18px 60px; }
    .verify-hero { text-align:center; margin-bottom:26px; }
    .verify-hero .shield { font-size:3.2rem; }
    .verify-card { padding: 8px; }
    .result-head { display:flex; align-items:center; gap:14px; padding:20px; border-radius:var(--r-md); }
    .result-head.ok { background:rgba(35,209,139,.12); border:1px solid rgba(35,209,139,.4); }
    .result-head.bad { background:rgba(255,71,87,.12); border:1px solid rgba(255,71,87,.4); }
    .result-head .big { font-size:2.4rem; }
    .kv { display:grid; grid-template-columns:auto 1fr; gap:10px 18px; padding:20px; }
    .kv .k { color:var(--text-300); font-size:.86rem; }
    .kv .v { font-weight:600; text-align:right; }
    .medal-lg { font-size:1.4rem; }
  </style>
</head>
<body class="app-bg">
  <div class="bg-orbs"><span></span><span></span><span></span><span></span></div>

  <div class="verify-wrap">
    <a class="brand" href="index.html" style="justify-content:center;display:flex;margin-bottom:24px">
      <span class="brand-mark">MR</span>
      <span class="brand-name">ME-RIISE <b>QUIZ</b></span>
    </a>
    <div class="verify-hero anim-up">
      <div class="shield">🛡️</div>
      <h1>Certificate Verification</h1>
      <p class="muted" style="margin-top:8px">Enter a Certificate ID to confirm its authenticity.</p>
    </div>

    <form id="verifyForm" class="glass card anim-up delay-1" style="margin-bottom:20px">
      <div class="row gap-2" style="flex-wrap:wrap">
        <input class="input grow mono" id="cidInput" placeholder="e.g. MR-123456-001-ABCD" style="text-transform:uppercase">
        <button class="btn btn-primary" type="submit">Verify</button>
      </div>
    </form>

    <div id="result"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/verify.js"></script>
</body>
</html>
